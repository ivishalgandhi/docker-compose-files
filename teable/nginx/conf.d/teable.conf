# Nginx reverse proxy for teable.vishal.home -> 127.0.0.1:3000
# Listens on port 80 (host network) and forwards to Teable app running with host networking.

server {
    listen 80;
    listen [::]:80;
    server_name teable.vishal.home;

    # Optional: basic health endpoint for container healthcheck
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_pass http://127.0.0.1:3000;
    }
}