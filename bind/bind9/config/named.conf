# include "/etc/bind/named.conf.options";
# include "/etc/bind/named.conf.local";
# include "/etc/bind/named.conf.default-zones";

# Define internal ACL
acl "internal" {
    127.0.0.1;        // localhost
    192.168.1.0/24;   // example LAN - replace with your LAN
    10.0.0.0/8;       // example private range - replace if used
    172.18.0.0/16;    // example docker network - replace with docker inspect result
    // Tailscale address space (100.64.0.0/10) and a placeholder for a single host can be added.
    100.64.0.0/10;    // Tailscale network range - allows tailscale peers
};

# Global options
options {
    forwarders {
        1.1.1.1;
        1.0.0.1;
    };
    # Listen on all IPv4 interfaces so bind can serve requests coming in on tailscale0
    listen-on { any; };
    listen-on-v6 { any; };
    allow-query { internal; };
};

zone "vishal.home" IN {
    type master;
    file "/etc/bind/zones/db.vishal.home";
    allow-update { none; };
};