version: '3.8'

services:
  bind9:
    build: .
    container_name: bind9
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - BIND9_USER=root
    # Use host networking so bind can listen on the host's tailscale0 interface.
    # This avoids Docker port mapping and lets bind bind directly to the Tailscale IP.
    network_mode: "host"
    volumes:
      - ./config:/etc/bind
      - ./cache:/var/cache/bind
      - ./records:/var/lib/bind