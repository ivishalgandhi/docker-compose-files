version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_server
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: vishal
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - postgres_network

networks:
  postgres_network:
    driver: bridge
